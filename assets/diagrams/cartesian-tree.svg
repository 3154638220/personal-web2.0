<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="title desc"><title id="title">笛卡尔树示意</title><desc id="desc">数组为 4、2、5、1、3。位置 k 满足二叉搜索树顺序，节点内的数值 w 满足小根堆性质。</desc><rect width="900" height="600" fill="#f7f5ef"/><style>text{font-family:Georgia,serif;fill:#202420}.mono{font-family:monospace}.muted{fill:#65685f}.accent{fill:#b74732}</style><text x="45" y="45" class="mono muted" font-size="13">CARTESIAN TREE / INORDER KEYS + MIN-HEAP VALUES</text><path d="M545 125L245 220" stroke="#a9b09e" stroke-width="2"/><path d="M545 125L695 220" stroke="#a9b09e" stroke-width="2"/><path d="M245 220L95 310" stroke="#a9b09e" stroke-width="2"/><path d="M245 220L395 310" stroke="#a9b09e" stroke-width="2"/><path d="M95 345V410" stroke="#d9d9ce" stroke-dasharray="4 5"/><circle cx="95" cy="310" r="27" fill="#f7f5ef" stroke="#737e66" stroke-width="2"/><text x="95" y="318" font-size="24" text-anchor="middle">4</text><text x="95" y="440" class="mono muted" font-size="17" text-anchor="middle">k=1</text><path d="M245 255V410" stroke="#d9d9ce" stroke-dasharray="4 5"/><circle cx="245" cy="220" r="27" fill="#f7f5ef" stroke="#737e66" stroke-width="2"/><text x="245" y="228" font-size="24" text-anchor="middle">2</text><text x="245" y="440" class="mono muted" font-size="17" text-anchor="middle">k=2</text><path d="M395 345V410" stroke="#d9d9ce" stroke-dasharray="4 5"/><circle cx="395" cy="310" r="27" fill="#f7f5ef" stroke="#737e66" stroke-width="2"/><text x="395" y="318" font-size="24" text-anchor="middle">5</text><text x="395" y="440" class="mono muted" font-size="17" text-anchor="middle">k=3</text><path d="M545 160V410" stroke="#d9d9ce" stroke-dasharray="4 5"/><circle cx="545" cy="125" r="27" fill="#f7f5ef" stroke="#b74732" stroke-width="2"/><text x="545" y="133" font-size="24" text-anchor="middle">1</text><text x="545" y="440" class="mono muted" font-size="17" text-anchor="middle">k=4</text><path d="M695 255V410" stroke="#d9d9ce" stroke-dasharray="4 5"/><circle cx="695" cy="220" r="27" fill="#f7f5ef" stroke="#737e66" stroke-width="2"/><text x="695" y="228" font-size="24" text-anchor="middle">3</text><text x="695" y="440" class="mono muted" font-size="17" text-anchor="middle">k=5</text><text x="45" y="495" class="mono accent" font-size="17">w = [4, 2, 5, 1, 3]</text><text x="45" y="540" class="mono muted" font-size="12">k: ARRAY POSITION / w: VALUE INSIDE EACH NODE</text><text x="45" y="572" class="mono muted" font-size="11">REDRAWN EXAMPLE / INORDER: k = 1, 2, 3, 4, 5</text></svg>