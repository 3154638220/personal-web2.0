<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 740" role="img" aria-labelledby="title desc"><title id="title">Euler 序对应的树</title><desc id="desc">按正文给出的 Euler 序重建：1 的子节点为 3、5；3 的子节点为 9、7；5 经 8 到 10；10 的子节点为 12、15；15 的子节点为 20、18。</desc><rect width="900" height="740" fill="#f7f5ef"/><style>text{font-family:Georgia,serif;fill:#202420}.mono{font-family:monospace}.muted{fill:#65685f}.accent{fill:#b74732}</style><text x="45" y="42" class="mono muted" font-size="13">EULER TOUR / A WALK THROUGH THE TREE</text><path d="M400 100L185 190" stroke="#a9b09e" stroke-width="2"/><path d="M185 190L95 280" stroke="#a9b09e" stroke-width="2"/><path d="M185 190L275 280" stroke="#a9b09e" stroke-width="2"/><path d="M400 100L580 190" stroke="#a9b09e" stroke-width="2"/><path d="M580 190L580 280" stroke="#a9b09e" stroke-width="2"/><path d="M580 280L580 370" stroke="#a9b09e" stroke-width="2"/><path d="M580 370L450 460" stroke="#a9b09e" stroke-width="2"/><path d="M580 370L690 460" stroke="#a9b09e" stroke-width="2"/><path d="M690 460L625 550" stroke="#a9b09e" stroke-width="2"/><path d="M690 460L785 550" stroke="#a9b09e" stroke-width="2"/><circle cx="400" cy="100" r="25" fill="#f7f5ef" stroke="#b74732" stroke-width="2"/><text x="400" y="107" font-size="21" text-anchor="middle">1</text><circle cx="185" cy="190" r="25" fill="#f7f5ef" stroke="#737e66" stroke-width="2"/><text x="185" y="197" font-size="21" text-anchor="middle">3</text><circle cx="95" cy="280" r="25" fill="#f7f5ef" stroke="#737e66" stroke-width="2"/><text x="95" y="287" font-size="21" text-anchor="middle">9</text><circle cx="275" cy="280" r="25" fill="#f7f5ef" stroke="#737e66" stroke-width="2"/><text x="275" y="287" font-size="21" text-anchor="middle">7</text><circle cx="580" cy="190" r="25" fill="#f7f5ef" stroke="#737e66" stroke-width="2"/><text x="580" y="197" font-size="21" text-anchor="middle">5</text><circle cx="580" cy="280" r="25" fill="#f7f5ef" stroke="#737e66" stroke-width="2"/><text x="580" y="287" font-size="21" text-anchor="middle">8</text><circle cx="580" cy="370" r="25" fill="#f7f5ef" stroke="#737e66" stroke-width="2"/><text x="580" y="377" font-size="21" text-anchor="middle">10</text><circle cx="450" cy="460" r="25" fill="#f7f5ef" stroke="#737e66" stroke-width="2"/><text x="450" y="467" font-size="21" text-anchor="middle">12</text><circle cx="690" cy="460" r="25" fill="#f7f5ef" stroke="#737e66" stroke-width="2"/><text x="690" y="467" font-size="21" text-anchor="middle">15</text><circle cx="625" cy="550" r="25" fill="#f7f5ef" stroke="#737e66" stroke-width="2"/><text x="625" y="557" font-size="21" text-anchor="middle">20</text><circle cx="785" cy="550" r="25" fill="#f7f5ef" stroke="#737e66" stroke-width="2"/><text x="785" y="557" font-size="21" text-anchor="middle">18</text><path d="M45 602H855" stroke="#d9d9ce"/><text x="45" y="638" class="mono muted" font-size="14">1 → 3 → 9 → 3 → 7 → 3 → 1 → 5 → 8 → 10 → 12 →</text><text x="45" y="669" class="mono accent" font-size="14">10 → 15 → 20 → 15 → 18 → 15 → 10 → 8 → 5 → 1</text><text x="45" y="710" class="mono muted" font-size="11">RECONSTRUCTED FROM THE EULER SEQUENCE IN THE ARTICLE</text></svg>