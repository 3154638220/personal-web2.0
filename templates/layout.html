<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="{{DESCRIPTION}}">
  <meta name="theme-color" content="#F7F5EF">
  <title>{{TITLE}}</title>
  <link rel="canonical" href="{{URL}}">
  <meta property="og:type" content="{{OG_TYPE}}">
  <meta property="og:site_name" content="qnxy">
  <meta property="og:title" content="{{TITLE}}">
  <meta property="og:description" content="{{DESCRIPTION}}">
  <meta property="og:url" content="{{URL}}">
  <meta property="og:image" content="{{BASE}}/assets/social.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:type" content="image/png">
  <meta name="twitter:card" content="summary_large_image">
  {{EXTRA_HEAD}}
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <script>try{document.documentElement.dataset.theme=localStorage.getItem('qnxy-theme')==='dark'?'dark':'light';document.documentElement.lang=localStorage.getItem('qnxy-lang')==='en'?'en':'zh-CN'}catch(e){}</script>
  {{VENDOR_CSS}}
  <link rel="stylesheet" href="{{STYLE}}">
  <script src="{{SCRIPT}}" defer></script>
</head>
<body class="{{BODY_CLASS}}">
  <a class="skip-link" href="#main" data-zh="跳到正文" data-en="Skip to content">跳到正文</a>
  {{NAV}}
  <main id="main">{{CONTENT}}</main>
  {{FOOTER}}
</body>
</html>
